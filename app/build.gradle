apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

// cassette (BUG-311): read this repo's git once at configuration. Outside a git checkout
// (a source archive) the build still works: version 1, sha "unknown".
def cassetteGit = { List<String> args ->
    try {
        return providers.exec {
            commandLine(['git', '-C', rootDir.absolutePath] + args)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return ''
    }
}
def cassetteCountText = cassetteGit(['rev-list', '--count', 'HEAD'])
def cassetteCommitCount = cassetteCountText.isInteger() ? cassetteCountText.toInteger() : 1
def cassetteShaText = cassetteGit(['rev-parse', '--short=8', 'HEAD'])
def cassetteGitSha = (cassetteShaText ?: 'unknown') + (cassetteGit(['status', '--porcelain', '--untracked-files=no']) ? '-dirty' : '')

android {
    compileSdk 35
    buildToolsVersion = '35.0.0'

    lint {
        // Cassette adds user-facing strings faster than this fork maintains the
        // 7 upstream locale files, so new strings fall back to the English
        // default. Don't fail a release build (lintVitalRelease) on that — real
        // lint issues still abort; only MissingTranslation is downgraded.
        disable 'MissingTranslation'
    }

    defaultConfig {
        minSdkVersion 24
        targetSdk 35

        // Cassette versioning (reset from upstream Tempo 3.9.0/26 at fork point 9cf62c8).
        // BUG-311: the version moves with every commit, so a crash report names its build.
        // versionCode = commits on this repo's main (always grows, so `install -r` upgrades);
        // versionName = 0.1.<that count>; GIT_SHA = the commit, "-dirty" for uncommitted work.
        versionCode cassetteCommitCount
        versionName "0.1.${cassetteCommitCount}"
        buildConfigField "String", "GIT_SHA", "\"${cassetteGitSha}\""

        // cassette: streaming (Server Mode playback of non-downloaded tracks) is
        // hidden + disabled in shipped builds until this flips true. Flipped in
        // source, never from the server, so an installed build can't be toggled
        // on by an account payload. Mirrors iOS CassetteFeatureFlags.isStreamingEnabled.
        buildConfigField "boolean", "STREAMING_UI_ENABLED", "false"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    flavorDimensions += "default"

    productFlavors {
        tempo {
            dimension = "default"
            applicationId 'digital.cassette.player'
        }

        notquitemy {
            dimension = "default"
            applicationId "com.cappielloantonio.notquitemy.tempo"
        }

        play {
            dimension = "default"
            applicationId "com.cappielloantonio.play.tempo"
        }
    }

    // cassette: a release build is signed only when the release key is handed in (scripts/build-release.sh reads
    // it from the Keychain of the Mac that holds it). Without it a release build comes out unsigned, so the
    // source still builds anywhere, and no key or password ever sits in this repo.
    def releaseKeystore = System.getenv('CASSETTE_ANDROID_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('CASSETTE_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CASSETTE_ANDROID_KEY_ALIAS') ?: 'cassette'
                keyPassword System.getenv('CASSETTE_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    namespace 'com.cappielloantonio.tempo'
}

dependencies {
    // cassette: the ffmpeg decoder extension is NOT bundled. Its prebuilt
    // libffmpegJNI.so is not 16 KB page aligned, which makes Android 15+
    // devices (the Pixel 8 among them) greet every launch with a compatibility
    // warning, and blocks Play distribution outright. It only adds formats
    // ExoPlayer cannot decode itself - ALAC, WMA, AC3 and friends - and the
    // library is FLAC and MP3, both native. The renderer factory asks for
    // extension renderers reflectively, so their absence is a silent no-op.
    // Restore this line (with an aligned rebuild) if exotic formats ever land.
    // implementation files('../libs/lib-decoder-ffmpeg-release.aar')

    // AndroidX
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.6'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Android Material
    implementation 'com.google.android.material:material:1.10.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:annotations:4.16.0'

    // Media3
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    tempoImplementation 'androidx.media3:media3-cast:1.5.1'
    playImplementation 'androidx.media3:media3-cast:1.5.1'

    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.14'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // cassette security track (docs/CASSETTE_PHONE_SECURITY_DESIGN_2026-11-09.md, monorepo):
    // music, downloads and covers reach the computer through OkHttp, so one door checks its key
    // (CassetteHubTrust); sign-in opens in a Custom Tab; Tink gives X25519 + HKDF on every
    // Android version for the sealed sign-in the computer app already uses (CassetteSeal).
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.crypto.tink:tink-android:1.15.0'

    // Unit tests (JVM) — cassette: CassetteLocalId parity fixture test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // cassette security track: a local https server with its own certificate, to check the
    // computer's door accepts its key and nothing else (CassetteHubTrustTest)
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.0.0-alpha.14'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.0.0-alpha.14'
}